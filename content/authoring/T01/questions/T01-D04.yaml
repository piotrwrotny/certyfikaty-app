stem: |-
  Rozpatruje się wyodrębnioną usługę archiwizacji obejmującą pracowników, szafy i rejestr elektroniczny. Jej elementy współdziałają, aby przechować i odnaleźć dokumenty. Który argument uzasadnia traktowanie tej całości jako systemu?
options:
- id: a
  text: Elementy tworzą spójną całość i współdziałają w osiąganiu wskazanego celu.
  rationale: |-
    Opis zawiera cel archiwizacji i skoordynowane elementy → to warunek inżynierskiego pojęcia system → argument jest trafny.
  rules:
  - REG-KRY-T01-04
  see: N-T01-04
  correct: true
- id: b
  text: Każda grupa przedmiotów jest systemem także bez związku między nimi.
  rationale: |-
    W przykładzie związek i cel są jawne → definicja nie obejmuje automatycznie przypadkowych grup → argument jest zbyt szeroki.
  rules:
  - REG-KRY-T01-04
  see: N-T01-04
  correct: false
- id: c
  text: Pracowników należy uznać za fragmenty kodu, aby zachować nazwę system.
  rationale: System CPRE może obejmować ludzi i organizację → nie trzeba utożsamiać ich z software → argument jest
    błędny.
  rules:
  - REG-T01-04-04
  see: N-T01-04
  correct: false
- id: d
  text: Brak nowego programu wyklucza jakiekolwiek wymagania wobec usługi.
  rationale: |-
    Przedmiotem są potrzeby wobec usługi → szeroki zakres systemów nie wymaga nowej aplikacji → wykluczenie nie wynika.
  rules:
  - REG-T01-04-02
  see: N-T01-04
  correct: false
