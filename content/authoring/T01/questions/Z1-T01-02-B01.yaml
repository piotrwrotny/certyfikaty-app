stem: Które zdanie poprawnie charakteryzuje requirements specification jako rezultat pracy?
options:
- id: a
  text: Wyłącznie kod wdrożonej aplikacji.
  rationale: |-
    Kod implementuje zachowanie, a nie z definicji zbiór wymagań → Requirements specification jako rezultat jest uporządkowanym zbiorem wymagań spełniającym ustalone kryteria. → nie wybrać.
  rules:
  - REG-T01-02-02
  see: N-T01-02
  correct: false
- id: b
  text: Zawsze pojedynczy papierowy formularz.
  rationale: Nośnik i liczba dokumentów nie definiują znaczenia → bezpodstawne zawężenie → nie wybrać.
  rules:
  - REG-T01-02-02
  see: N-T01-02
  correct: false
- id: c
  text: Uporządkowany zbiór wymagań spełniający ustalone kryteria.
  rationale: Chodzi o rezultat → zbiór wymagań o uporządkowanej reprezentacji → wybrać.
  rules:
  - REG-T01-02-02
  see: N-T01-02
  correct: true
- id: d
  text: Dowolną rozmowę niezależnie od jej utrwalenia i struktury.
  rationale: |-
    Rozmowa nie gwarantuje reprezentacji spełniającej kryteria → definicja rezultatu nie jest spełniona → nie wybrać.
