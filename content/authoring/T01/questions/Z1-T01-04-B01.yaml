stem: Które stwierdzenie jest zgodne ze znaczeniem system w CPRE?
options:
- id: a
  text: System może obejmować oprogramowanie, ludzi i elementy organizacyjne.
  rationale: |-
    Szerokie znaczenie obejmuje takie całości → System socjotechniczny obejmuje oprogramowanie, sprzęt, ludzi i aspekty organizacyjne. → wybrać.
  rules:
  - REG-T01-04-04
  see: N-T01-04
  correct: true
- id: b
  text: System to zawsze wyłącznie kod aplikacji.
  rationale: |-
    Bezpodstawne zawężenie pomija inne rodzaje całości → W CPRE pojęcie system obejmuje także produkty, usługi, urządzenia, procedury oraz komponenty i złożenia systemów. → nie wybrać.
  rules:
  - REG-T01-04-02
  see: N-T01-04
  correct: false
- id: c
  text: System nigdy nie zawiera innych systemów.
  rationale: |-
    Definicja dopuszcza podsystemy → System może zawierać podsystemy, a komponent może sam być rozpatrywany jako analizowany system. → nie wybrać.
  rules:
  - REG-T01-04-03
  see: N-T01-04
  correct: false
- id: d
  text: Każdy przypadkowy zbiór przedmiotów jest systemem niezależnie od celu i współdziałania.
  rationale: |-
    W sensie inżynierskim potrzebne są spójność i wspólny cel → System w znaczeniu inżynierskim jest spójną, dającą się wyodrębnić całością elementów osiągających cel przez skoordynowane współdziałanie. → nie wybrać.
  rules:
  - REG-KRY-T01-04
  see: N-T01-04
  correct: false
