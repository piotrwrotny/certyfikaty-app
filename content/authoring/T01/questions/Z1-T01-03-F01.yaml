stem: |-
  System przydziela miejsca parkingowe pracownikom. Obsługuje go administrator. Pracownik objęty przydziałem nie korzysta z systemu. Która etykieta jest uzasadniona dla tego pracownika?
options:
- id: a
  text: Stakeholder, ponieważ wynik systemu na niego wpływa.
  rationale: Przydział dotyczy pracownika → jest dotknięty systemem → wybrać.
  rules:
  - REG-KRY-T01-03
  see: N-T01-03
  correct: true
- id: b
  text: Na pewno user, ponieważ każdy stakeholder jest userem.
  rationale: Nie korzysta z funkcjonalności → odwrócono relację user–stakeholder → nie wybrać.
  rules:
  - REG-T01-03-02
  see: N-T01-03
  correct: false
- id: c
  text: Nie jest stakeholder, bo nie ma konta.
  rationale: |-
    Konto nie jest warunkiem definicji → Stakeholder to osoba lub organizacja wpływająca na wymagania systemu albo podlegająca wpływowi tego systemu. → nie wybrać.
  rules:
  - REG-KRY-T01-03
  see: N-T01-03
  correct: false
- id: d
  text: Wyłącznie element oprogramowania.
  rationale: Pracownik jest osobą → nie jest komponentem kodu → nie wybrać.
  rules:
  - REG-KRY-T01-03
  see: N-T01-03
  correct: false
