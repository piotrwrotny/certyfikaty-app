stem: Który opis najtrafniej oddaje cel RE?
options:
- id: a
  text: Zmaksymalizować liczbę stron bez względu na potrzeby.
  rationale: |-
    Objętość nie jest celem definicyjnym → RE jest systematycznym i zdyscyplinowanym podejściem do specyfikowania i zarządzania wymaganiami w celu zrozumienia potrzeb interesariuszy i ograniczenia ryzyka ich niespełnienia przez dostarczony system. → nie wybrać.
  rules:
  - REG-KRY-T01-05
  see: N-T01-05
  correct: false
- id: b
  text: Zastąpić wszystkie decyzje projektowe jednym narzędziem.
  rationale: |-
    Narzędzie nie zastępuje pracy z potrzebami → Systematyczna praca RE wymaga doboru procesów i praktyk do sytuacji, a nie jednego uniwersalnego narzędzia lub sposobu pracy. → nie wybrać.
  rules:
  - REG-T01-05-03
  see: N-T01-05
  correct: false
- id: c
  text: Zagwarantować brak jakichkolwiek przyszłych zmian.
  rationale: |-
    RE ogranicza ryzyko; nie gwarantuje niezmienności → RE jest systematycznym i zdyscyplinowanym podejściem do specyfikowania i zarządzania wymaganiami w celu zrozumienia potrzeb interesariuszy i ograniczenia ryzyka ich niespełnienia przez dostarczony system. → nie wybrać.
  rules:
  - REG-KRY-T01-05
  see: N-T01-05
  correct: false
- id: d
  text: Zrozumieć potrzeby i zmniejszyć ryzyko dostarczenia systemu, który ich nie spełnia.
  rationale: |-
    Opis wskazuje cel definicyjny → RE jest systematycznym i zdyscyplinowanym podejściem do specyfikowania i zarządzania wymaganiami w celu zrozumienia potrzeb interesariuszy i ograniczenia ryzyka ich niespełnienia przez dostarczony system. → wybrać.
  rules:
  - REG-KRY-T01-05
  see: N-T01-05
  correct: true
