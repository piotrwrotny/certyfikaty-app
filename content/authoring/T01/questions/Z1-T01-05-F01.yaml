  text: Obowiązek użycia jednego konkretnego programu.
  rationale: |-
    Definicja nie wyznacza narzędzia → Systematyczna praca RE wymaga doboru procesów i praktyk do sytuacji, a nie jednego uniwersalnego narzędzia lub sposobu pracy. → nie wybrać.
