stem: Które stwierdzenie o roli Requirements Engineer jest poprawne?
options:
- id: a
  text: Zawsze sprowadza się do przepisywania wypowiedzi bez rozumienia problemu.
  rationale: |-
    Rola obejmuje wiedzę i most problem–rozwiązania → Charakterystyka roli obejmuje wykonywanie zadań RE, pogłębioną wiedzę RE i łączenie problemu z potencjalnymi rozwiązaniami. → nie wybrać.
  rules:
  - REG-T05-02-02
  see: N-T05-02
  correct: false
- id: b
  text: Nie wymaga znajomości RE.
  rationale: |-
    Pogłębiona wiedza należy do charakterystyki → Charakterystyka roli obejmuje wykonywanie zadań RE, pogłębioną wiedzę RE i łączenie problemu z potencjalnymi rozwiązaniami. → nie wybrać.
  rules:
  - REG-T05-02-02
  see: N-T05-02
  correct: false
- id: c
  text: Może być pełniona przez Product Ownera lub programistę.
  rationale: |-
    §1.5 wymienia różne funkcje zawodowe → Rolę Requirements Engineer mogą pełnić między innymi analitycy, specjaliści aplikacyjni, Product Owners, inżynierowie systemów i programiści. → wybrać.
  rules:
  - REG-T05-02-03
  see: N-T05-02
  correct: true
- id: d
  text: Musi być osobnym stanowiskiem w każdej organizacji.
  rationale: |-
    Syllabus mówi zwykle o roli, nie obowiązkowym etacie → Requirements Engineer zwykle oznacza rolę, a nie nazwę stanowiska. → nie wybrać.
  rules:
  - REG-KRY-T05-02
  see: N-T05-02
  correct: false
