stem: |-
  W nowym projekcie Product Owner kompetentnie pozyskuje i waliduje wymagania oraz wyjaśnia ich związek z rozwiązywanym problemem. Kierownik uznaje, że bez zmiany nazwy etatu osoba nie może pełnić roli RE. Który argument jest trafny?
options:
- id: a
  text: Opisane działania i wiedza mogą odpowiadać roli RE, niezależnie od nazwy etatu.
  rationale: |-
    Podano czynności i łączenie problemu z rozwiązaniem → charakterystyka roli dotyczy pracy, nie wyłącznie etykiety → argument jest poprawny.
  rules:
  - REG-T05-02-02
  see: N-T05-02
  correct: true
- id: b
  text: Zmiana nazwy etatu sama zapewniłaby wszystkie kompetencje.
  rationale: Nowa nazwa nie dodaje wiedzy ani wykonania → opis roli wymaga rzeczywistych cech → argument jest błędny.
  rules:
  - REG-T05-02-02
  see: N-T05-02
  correct: false
- id: c
  text: Product Owner jest w Syllabus z definicji wyłączony z roli RE.
  rationale: Ta funkcja jest dopuszczona w §1.5 → wykluczenie przeczy wykazowi → argument jest błędny.
  rules:
  - REG-T05-02-03
  see: N-T05-02
  correct: false
- id: d
  text: W roli RE nigdy nie wolno rozważać potencjalnych rozwiązań.
  rationale: Podano łączenie problemu z rozwiązaniami → jest to część charakterystyki → zakaz jest błędny.
  rules:
  - REG-T05-02-02
  see: N-T05-02
  correct: false
