stem: Które DWIE czynności odpowiadają walidacji lub zarządzaniu wymaganiami?
options:
- id: a
  text: Pozyskanie nowej potrzeby w wywiadzie, bez jej sprawdzania lub zarządzania istniejącym zapisem.
  rationale: |-
    To elicitation, nie jedna z dwóch czynności wyznaczonych pytaniem → Głównymi zadaniami RE są pozyskiwanie, dokumentowanie, walidacja i zarządzanie wymaganiami. → nie wybrać.
  rules:
  - REG-KRY-T05-01
  see: N-T05-01
  correct: false
- id: b
  text: Utrwalenie treści rozmowy jako nowego opisu, bez oceny adekwatności.
  rationale: |-
    To dokumentowanie; sam zapis nie jest walidacją ani obsługą istniejącego wymagania → Głównymi zadaniami RE są pozyskiwanie, dokumentowanie, walidacja i zarządzanie wymaganiami. → nie wybrać.
  rules:
  - REG-KRY-T05-01
  see: N-T05-01
  correct: false
- id: c
  text: Sprawdzenie, czy zapisane oczekiwanie odpowiada potrzebie interesariusza.
  rationale: To potwierdzenie adekwatności wobec potrzeby → walidacja → wybrać.
  rules:
  - REG-T05-01-05
  see: N-T05-01
  correct: true
- id: d
  text: Utrzymanie wersji i obsługa zmiany istniejącego wymagania.
  rationale: |-
    To zarządzanie istniejącymi wymaganiami → Zarządzanie wymaganiami obejmuje istniejące wymagania i powiązane artefakty, w tym przechowywanie, zmiany i śledzenie powiązań. → wybrać.
  rules:
  - REG-T05-01-04
  see: N-T05-01
  correct: true
