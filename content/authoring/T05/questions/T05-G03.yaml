stem: |-
  Program kursu obejmuje wyłącznie rysowanie diagramów w jednym edytorze. Organizator uważa, że to pełny zakres przygotowania RE. Która ocena jest trafna?
options:
- id: a
  text: Kurs jest pełny, jeżeli edytor ma wiele funkcji.
  rationale: |-
    Liczba funkcji narzędzia nie pokrywa sześciu obszarów → obsługa programu nie wyczerpuje RE → ocena jest błędna.
  rules:
  - REG-T05-03-02
  see: N-T05-03
  correct: false
- id: b
  text: Z zakresu RE należy usunąć zarządzanie istniejącymi wymaganiami.
  rationale: Zarządzanie znajduje się w §1.6 → redukcja kursu nie zmienia wykazu → ocena jest błędna.
  rules:
  - REG-KRY-T05-03
  see: N-T05-03
  correct: false
- id: c
  text: Pozostałe obszary zastąpi sam tytuł certyfikatu.
  rationale: Tytuł nie jest treścią kursu → wymagany zakres obejmuje konkretne obszary → ocena nie wynika.
  rules:
  - REG-KRY-T05-03
  see: N-T05-03
  correct: false
- id: d
  text: |-
    Brakuje zakresów zasad, opracowywania, procesów i zarządzania, a samo narzędzie nie wyczerpuje także dokumentowania.
  rationale: Program opisuje tylko diagramy i edytor → §1.6 obejmuje szerszą szóstkę → zarzut niepełności jest uzasadniony.
  rules:
  - REG-KRY-T05-03
  see: N-T05-03
  correct: true
