- type: distinguishes
  to: REG-KRY-T06-01
  meaning: |-
    Oś: nazwa zasady versus jej wyjaśnienie. „Ewolucja” jest etykietą L1; wyjaśnienie przyczyn zmian i potrzeby stabilności to T07/PR07 L2.
  from: CMP-KRY-T06-01
- type: explains
  to: REG-KRY-T06-01
  meaning: Nota wyjaśnia znaczenie, warunki i granicę reguły dla tego zakresu.
