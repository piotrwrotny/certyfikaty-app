relations:
- type: illustrates
  to: REG-KRY-T06-01
  meaning: Zadanie „wymień zasady” wymaga dziewięciu nazw, nie szczegółowego planu review ani diagramu procesu.
  from: EX-KRY-T06-01
- type: counterexample-of
  to: REG-KRY-T06-01
