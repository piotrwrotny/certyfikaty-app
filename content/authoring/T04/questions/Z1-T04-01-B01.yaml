stem: Które DWA twierdzenia poprawnie opisują zakres zastosowania RE?
options:
- id: a
  text: RE może dotyczyć urządzenia i współpracującego oprogramowania.
  rationale: |-
    Szerokie znaczenie systemu obejmuje całość cyberfizyczną → RE może dotyczyć dowolnego rodzaju systemu, chociaż dominującym zastosowaniem są systemy z ważną rolą oprogramowania. → wybrać.
  rules:
  - REG-KRY-T04-01
  see: N-T04-01
  correct: true
- id: b
  text: RE może dotyczyć procedury realizującej określony cel organizacji.
  rationale: |-
    Procedura może być przedmiotem wymagań przy szerokim znaczeniu systemu → RE może dotyczyć dowolnego rodzaju systemu, chociaż dominującym zastosowaniem są systemy z ważną rolą oprogramowania. → wybrać.
  rules:
  - REG-KRY-T04-01
  see: N-T04-01
  correct: true
- id: c
  text: Dominacja zastosowań software oznacza, że RE jest z definicji ograniczone do samego kodu.
  rationale: |-
    Opis dominującego zastosowania nie jest ograniczeniem normatywnym → RE może dotyczyć dowolnego rodzaju systemu, chociaż dominującym zastosowaniem są systemy z ważną rolą oprogramowania. → nie wybrać.
  rules:
  - REG-KRY-T04-01
  see: N-T04-01
  correct: false
- id: d
  text: RE można stosować tylko wtedy, gdy wybrano liniowy proces wytwarzania.
  rationale: |-
    Zastosowanie nie jest uzależnione od takiego procesu; zasady dotyczą różnych podejść → Potrzeba systematycznego RE nie zależy od wybrania liniowego procesu wytwarzania. → nie wybrać.
  rules:
  - REG-T04-01-04
  see: N-T04-01
  correct: false
