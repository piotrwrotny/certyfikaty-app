stem: Oceń twierdzenia o zastosowaniu RE.
options:
- id: '1'
  text: RE może obejmować wymagania dla usługi z elementami organizacyjnymi.
  rationale: |-
    Usługi i elementy organizacyjne są dopuszczone → Systemy, w których istotne jest oprogramowanie, mogą obejmować także składniki fizyczne i organizacyjne. → Prawda.
  rules:
  - REG-T04-01-02
  see: N-T04-01
  truth: true
- id: '2'
  text: Dominujące zastosowanie w software oznacza zakaz RE dla sprzętu.
  rationale: |-
    Dominacja opisuje praktykę, nie wyłączność → RE może dotyczyć dowolnego rodzaju systemu, chociaż dominującym zastosowaniem są systemy z ważną rolą oprogramowania. → Fałsz.
  rules:
  - REG-KRY-T04-01
  see: N-T04-01
  truth: false
- id: '3'
  text: System z software i elementami fizycznymi może być cyberfizyczny.
  rationale: |-
    To podany zakres określenia składu → System z oprogramowaniem i elementami fizycznymi może być określany jako cyberfizyczny. → Prawda.
  rules:
  - REG-T04-01-03
  see: N-T04-01
  truth: true
