  text: Zwinny proces wytwarzania usuwa potrzebę walidacji i zarządzania wymaganiami.
  rationale: |-
    Proces agile nie znosi głównych zadań RE → Systematyczne pozyskiwanie, dokumentowanie, walidowanie i zarządzanie wymaganiami jest potrzebne niezależnie od procesu wytwarzania systemu. → Fałsz.
