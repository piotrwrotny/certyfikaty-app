stem: |-
  Analizowany system to aplikacja rejestrująca wejścia na podstawie sygnału oddzielnej bramki. Bramki nie można zmieniać; zewnętrzną procedurę reakcji ochrony można przeprojektować. Potrzebą jest faktyczne niedopuszczenie nieuprawnionych osób. Który argument jest właściwy?
options:
- id: a
  text: Poprawny rekord wejścia sam gwarantuje rzeczywiste zabezpieczenie strefy.
  rationale: |-
    Aplikacja obserwuje sygnał, a cel dotyczy realnego dostępu → mapowanie wymaga odpowiednich warunków otoczenia → gwarancja nie wynika.
  rules:
  - REG-T07-04-05
  see: N-T07-04
  correct: false
- id: b
  text: Trzeba sprawdzić związek sygnału z przejściem i reakcją, niezależnie od możliwości zmiany bramki.
  rationale: |-
    Podano realny cel i zewnętrzny sygnał → zasada obejmuje istotność, mapowanie i założenia → argument jest trafny.
  rules:
  - REG-T07-04-04
  see: N-T07-04
  correct: true
- id: c
  text: Możliwość zmiany procedury automatycznie czyni ją częścią aplikacji.
  rationale: Procedurę określono jako zewnętrzną → scope i granica systemu są odrębne → taki wniosek jest błędny.
  rules:
  - REG-T07-04-03
  see: N-T07-04
  correct: false
- id: d
  text: Bramkę wolno pominąć, ponieważ nie należy do zakresu zmian.
  rationale: Bramka dostarcza decydujący sygnał → brak zmiany nie usuwa istotności → pominięcie jest błędne.
  rules:
  - REG-T07-04-02
  see: N-T07-04
  correct: false
