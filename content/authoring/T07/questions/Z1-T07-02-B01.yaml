stem: |-
  Projekt rozmawiał tylko z kupującym i użytkownikami końcowymi. Nie uwzględnił operatora usługi. Dla licznej przyszłej grupy stworzono personę. Które DWIE oceny są uzasadnione?
options:
- id: a
  text: Pominięcie operatora może oznaczać pominięcie istotnych wymagań.
  rationale: Operator to możliwa istotna rola → ograniczenie rozmów może pozostawić potrzebę poza analizą → wybrać.
  rules:
  - REG-KRY-T07-02
  see: N-T07-02
  correct: true
- id: b
  text: Persona może pomóc opisać archetypowe potrzeby nieznanej jeszcze grupy.
  rationale: |-
    Duża/nieznana grupa spełnia warunki użycia persony → Persona jest fikcyjnym archetypowym opisem grupy lub nieznanych jeszcze osób, a nie rzeczywistą osobą potwierdzającą ich zgodę. → wybrać.
  rules:
  - REG-T07-02-03
  see: N-T07-02
  correct: true
- id: c
  text: Sama persona dowodzi zgody wszystkich przyszłych użytkowników.
  rationale: |-
    Fikcyjny archetyp nie jest uzgodnieniem realnych osób → Persona jest fikcyjnym archetypowym opisem grupy lub nieznanych jeszcze osób, a nie rzeczywistą osobą potwierdzającą ich zgodę. → nie wybrać.
  rules:
  - REG-T07-02-03
  see: N-T07-02
  correct: false
- id: d
  text: Każdą sprzeczną propozycję wszystkich ról należy przyjąć jednocześnie.
  rationale: |-
    Konflikt wymaga rozwiązania, nie niemożliwego równoczesnego spełnienia → Różne potrzeby i punkty widzenia interesariuszy mogą prowadzić do konfliktów, które RE powinno identyfikować i rozwiązywać. → nie wybrać.
  rules:
  - REG-T07-02-04
  see: N-T07-02
  correct: false
