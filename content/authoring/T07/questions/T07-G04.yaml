stem: |-
  Analizowaną całością jest aplikacja planowania dostaw z wewnętrznym katalogiem używanym bez zmian. Oddzielny czujnik zbiornika przekazuje opóźnione dane i pozostaje niezmieniany. Zewnętrzną procedurę dostaw można zmienić. Cel dotyczy rzeczywistego niedopuszczenia do przepełnienia. Oceń argumenty.
options:
- id: '1'
  text: Brak zmiany katalogu dowodzi, że katalog leży poza aplikacją.
  rationale: Katalog został jawnie włączony do aplikacji → scope nie wyznacza automatycznie granicy → Fałsz.
  rules:
  - REG-T07-04-03
  see: N-T07-04
  truth: false
- id: '2'
  text: Opóźnienie czujnika jest istotne dla powiązania decyzji aplikacji z realnym poziomem zbiornika.
  rationale: System obserwuje dane opóźnione, a cel realny stan → mapowanie wymaga założeń o danych i reakcji →
    Prawda.
  rules:
  - REG-T07-04-05
  see: N-T07-04
  truth: true
- id: '3'
  text: Zmiana zewnętrznej procedury może zmienić wymagania aplikacji bez automatycznej zmiany jej granicy.
  rationale: Procedura wpływa na dostawy → zmiany kontekstu trzeba uwzględnić → Prawda.
  rules:
  - REG-T07-04-04
  see: N-T07-04
  truth: true
- id: '4'
  text: Poprawne zapisanie odczytu samo zapewnia brak przepełnienia w świecie rzeczywistym.
  rationale: Zapis dotyczy sygnału → realny cel wymaga odpowiednich warunków otoczenia → Fałsz.
  rules:
  - REG-T07-04-05
  see: N-T07-04
  truth: false
