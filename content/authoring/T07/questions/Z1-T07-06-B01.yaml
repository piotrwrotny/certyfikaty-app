stem: Które TRZY pytania odpowiadają zasadzie walidacji?
options:
- id: a
  text: Czy założenia kontekstu są rozsądne?
  rationale: |-
    Realność założeń to trzeci aspekt → Walidacja sprawdza porozumienie interesariuszy, adekwatne pokrycie potrzeb przez wymagania i rozsądność założeń kontekstu. → wybrać.
  rules:
  - REG-T07-06-02
  see: N-T07-06
  correct: true
- id: b
  text: Czy wybrano najdroższy edytor dokumentacji?
  rationale: |-
    Cena narzędzia nie jest wskazanym pytaniem walidacji → Walidacja sprawdza porozumienie interesariuszy, adekwatne pokrycie potrzeb przez wymagania i rozsądność założeń kontekstu. → nie wybrać.
  rules:
  - REG-T07-06-02
  see: N-T07-06
  correct: false
- id: c
  text: Czy z dokumentu usunięto wszystkie numerowane punkty?
  rationale: |-
    Sposób numeracji nie potwierdza zgodności z potrzebami → Poprawność zapisu lub zgodność ze specyfikacją nie zastępuje potwierdzenia zgodności wymagania z potrzebami interesariuszy. → nie wybrać.
  rules:
  - REG-T07-06-03
  see: N-T07-06
  correct: false
- id: d
  text: Czy interesariusze osiągnęli porozumienie co do wymagań?
