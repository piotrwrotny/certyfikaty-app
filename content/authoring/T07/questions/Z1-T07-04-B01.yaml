stem: |-
  Aplikacja magazynowa obejmuje formularz i stary moduł ewidencji używany bez zmian. Oddzielna procedura kontroli skanu może zostać przeprojektowana. Fizyczny zwrot narzędzia ma być odzwierciedlony skanem; aplikacja obserwuje wyłącznie skan. Oceń argumenty.
options:
- id: '1'
  text: Stary moduł jest poza aplikacją tylko dlatego, że nie wolno go zmienić.
  rationale: |-
    Stem włącza go do aplikacji; brak zmiany dotyczy scope → Niezmieniany komponent może być wewnątrz systemu, a element kontekstu może być objęty możliwością przeprojektowania. → Fałsz.
  rules:
  - REG-T07-04-03
  see: N-T07-04
  truth: false
- id: '2'
  text: Procedura może być zewnętrzna i zarazem objęta zakresem zmiany.
  rationale: |-
    Dane jawnie rozdzielają przynależność i możliwość projektowania → Niezmieniany komponent może być wewnątrz systemu, a element kontekstu może być objęty możliwością przeprojektowania. → Prawda.
  rules:
  - REG-T07-04-03
  see: N-T07-04
  truth: true
- id: '3'
  text: Poprawny zapis skanu sam w sobie gwarantuje fizyczny zwrot.
  rationale: |-
    System widzi sygnał; zgodność sygnału z faktem wymaga warunku otoczenia → Spełnienie wymagania systemowego o zarejestrowaniu sygnału nie gwarantuje spełnienia wymagania świata rzeczywistego bez odpowiednich warunków wiążących sygnał z realnym zjawiskiem. → Fałsz.
  rules:
  - REG-T07-04-05
  see: N-T07-04
  truth: false
- id: '4'
  text: Zmiana sposobu kontroli skanu może wpłynąć na wymagania aplikacji.
  rationale: Zmieniona procedura to istotny kontekst → możliwy wpływ na wymagania → Prawda.
  rules:
  - REG-T07-04-04
  see: N-T07-04
  truth: true
