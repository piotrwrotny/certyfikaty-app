  - REG-T07-04-05
  see: N-T07-04
  correct: false
- id: e
  text: Możliwość przeprojektowania procedury nie zmienia jej automatycznie w część aplikacji.
  rationale: Opis jawnie umieszcza procedurę na zewnątrz → scope i granica systemu są różne → argument jest trafny.
