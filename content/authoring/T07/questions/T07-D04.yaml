  see: N-T07-04
  correct: true
- id: d
  text: Poprawna obsługa otrzymanej liczby zawsze dowodzi spełnienia celu dotyczącego realnych przesyłek.
  rationale: |-
    Podano możliwość błędnego wyzerowania → sygnał nie gwarantuje realnego stanu bez warunków → argument jest błędny.
