stem: |-
  Sortownia ma kierować rzeczywiście ciężkie przesyłki do obsługi ręcznej. Aplikacja obserwuje jedynie wynik z oddzielnej, niezmienianej wagi. Waga bywa błędnie wyzerowana. Zewnętrzną procedurę jej przygotowania można przeprojektować. Które argumenty są uzasadnione?
options:
- id: a
  text: Warunek poprawnego przygotowania wagi jest istotny dla powiązania wyniku z rzeczywistą masą.
  rationale: |-
    System widzi wskazanie, a potrzeba dotyczy fizycznej cechy → mapowanie wymaga odpowiedniego założenia otoczenia → argument jest trafny.
  rules:
  - REG-T07-04-05
  see: N-T07-04
  correct: true
- id: b
  text: Brak zmiany wagi usuwa jej wpływ na wymagania aplikacji.
  rationale: Waga dostarcza rozstrzygający sygnał → scope nie przesądza istotności → argument jest błędny.
  rules:
  - REG-T07-04-02
  see: N-T07-04
  correct: false
- id: c
  text: Zmiana procedury przygotowania może wpłynąć na wymagania i założenia aplikacji.
  rationale: Procedura wpływa na wiarygodność danych → zmiany kontekstu należy rozpatrywać → argument jest trafny.
  rules:
