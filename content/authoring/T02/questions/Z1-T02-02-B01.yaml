stem: Który zakres ma non-functional requirement w przyjętym Glossary IREB?
options:
- id: a
  text: Każdy błędnie napisany zapis.
  rationale: |-
    Jakość redakcyjna nie jest definicją rodzaju → Rodzaj oczekiwania i jakość jego zapisu są odrębnymi osiami oceny, więc jednoznaczny zapis funkcji nie staje się przez to quality requirement. → nie wybrać.
  rules:
  - REG-T02-02-03
  see: N-T02-02
  correct: false
- id: b
  text: Wyłącznie quality requirement.
  rationale: Pomija constraint → za wąski zakres → nie wybrać.
  rules:
  - REG-KRY-T02-02
  see: N-T02-02
  correct: false
- id: c
  text: Quality requirement albo constraint.
  rationale: |-
    Oba człony odpowiadają hasłu → Non-functional requirement w Glossary IREB oznacza quality requirement albo constraint. → wybrać.
  rules:
  - REG-KRY-T02-02
  see: N-T02-02
  correct: true
- id: d
  text: Wyłącznie każda funkcja związana z bezpieczeństwem.
  rationale: |-
    Cel bezpieczeństwa może prowadzić do funkcji, lecz nie definiuje NFR → Perspektywa user requirement nie wyklucza typu quality requirement ani functional requirement. → nie wybrać.
  rules:
  - REG-T02-02-04
  see: N-T02-02
  correct: false
