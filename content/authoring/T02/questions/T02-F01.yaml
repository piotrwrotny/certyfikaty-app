stem: |-
  System po anulowaniu zlecenia ma wysłać operatorowi komunikat. Przy zadanym obciążeniu 99% komunikatów ma dotrzeć w 3 s. Do wysyłki dodatkowo narzucono komponent Omega, mimo innych rozwiązań spełniających oba oczekiwania. Oceń klasyfikacje.
options:
- id: '1'
  text: Wysłanie komunikatu jest wymaganiem funkcjonalnym.
  rationale: Podano zachowanie po anulowaniu → wymagany wynik/interakcja to functional requirement → Prawda.
  rules:
  - REG-T02-01-02
  see: N-T02-01
  truth: true
- id: '2'
  text: Warunek czasu dotarcia komunikatów jest wymaganiem jakościowym.
  rationale: Podano czas dla odsetka przy obciążeniu → dotyczy wydajności → Prawda.
  rules:
  - REG-T02-01-03
  see: N-T02-01
  truth: true
- id: '3'
  text: Całe zdanie musi mieć jeden rodzaj, ponieważ użyto jednego słowa komunikat.
  rationale: Opis łączy zachowanie, cechę i narzucony komponent → rodzaj wynika z przedmiotu każdego oczekiwania
    → Fałsz.
  rules:
  - REG-KRY-T02-01
  see: N-T02-01
  truth: false
- id: '4'
  text: Dodatkowy nakaz Omega jest constraint.
  rationale: Alternatywy spełniają funkcję i jakość → nakaz wykracza poza ich konieczne spełnienie → Prawda.
  rules:
  - REG-T02-01-04
  see: N-T02-01
  truth: true
