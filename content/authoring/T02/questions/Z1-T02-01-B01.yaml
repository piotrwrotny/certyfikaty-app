stem: |-
  Dla systemu wydawania sprzętu oceń pary opis–typ. Wybrany czytnik Z jest narzucony mimo dostępności innych czytników spełniających wszystkie podane funkcje i cechy jakościowe. Które TRZY pary wraz z powodem są poprawne?
options:
- id: a
  text: „Użyj czytnika Z” — constraint, bo dodatkowo narzucono rozwiązanie mimo odpowiednich alternatyw.
  rationale: Przesłanka alternatyw jest jawna → dodatkowe zawężenie → wybrać.
  rules:
  - REG-T02-01-04
  see: N-T02-01
  correct: true
- id: b
  text: „Po wydaniu sprzętu wyślij SMS” — quality, bo poprawia obsługę klienta.
  rationale: Wysyłanie to zachowanie → jego korzystny cel nie zmienia typu → nie wybrać.
  rules:
  - REG-T02-01-05
  see: N-T02-01
  correct: false
- id: c
  text: „Limit pamięci procesu to 180 MiB w podanym teście” — constraint, bo każda liczba oznacza narzucony komponent.
  rationale: Limit zasobu nie nazywa komponentu → cecha jakości, błędna reguła → nie wybrać.
  rules:
  - REG-T02-01-03
  see: N-T02-01
  correct: false
- id: d
  text: „Potwierdzenie zawiera identyfikator wypożyczenia” — functional, bo opisuje dane wymaganego wyniku.
  rationale: Dane potwierdzenia są rezultatem funkcji → typ i argument właściwe → wybrać.
  rules:
  - REG-T02-01-02
  see: N-T02-01
  correct: true
- id: e
  text: „95% identyfikacji w ≤0,8 s przy 30 terminalach” — quality, bo podaje cechę czasu w warunkach pracy.
  rationale: |-
    Czas identyfikacji to concern jakości → Quality requirement dotyczy zagadnienia jakości nieobjętego wymaganiem funkcjonalnym, na przykład wydajności lub dostępności. → wybrać.
  rules:
  - REG-T02-01-03
  see: N-T02-01
  correct: true
