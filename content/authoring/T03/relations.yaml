relations:
- type: illustrates
  to: REG-KRY-T03-01
  meaning: |-
    Przed estymacją ustalono, że anulowanie ma zwalniać również część rezerwacji. Zespół może uwzględnić dodatkowe zachowanie w nakładzie i scenariuszach testów.
  from: EX-KRY-T03-01
- type: counterexample-of
  to: REG-KRY-T03-01
  meaning: |-
    Uogólnienie „RE gwarantuje trafny budżet” obala projekt z poprawnie uzgodnionymi wymaganiami i błędną oceną złożoności technicznej. Wymagania są podstawą, nie gwarancją.
  from: CE-KRY-T03-01
- type: distinguishes
  to: REG-KRY-T03-01
  meaning: |-
    Oś: rezultat bezpośredni i korzyść. Uzgodniona reguła zwrotu jest rezultatem RE; mniejsze ryzyko przeróbki, lepsza estymacja i podstawa testu to możliwe skutki użycia tego rezultatu.
  from: CMP-KRY-T03-01
- type: explains
  to: REG-KRY-T03-01
  meaning: Nota wyjaśnia znaczenie, warunki i granicę reguły dla tego zakresu.
  from: N-T03-01
- type: variant-of
  to: Z1-T03-01-B01
  meaning: Zmiana z korzyści testowania i estymacji w B na uniknięcie niewłaściwego problemu; otwarte F pozostaje.
  condition: Ten sam rdzeń wiedzy; różnice opisane autorsko, bez ustalenia niezależności lub nowości.
