stem: Oceń twierdzenia o symptomach i przyczynach niewłaściwego RE.
options:
- id: '1'
  text: Brakujące i niejasne wymagania są wymienionymi symptomami.
  rationale: |-
    Obie kategorie są w §1.2 → Typowymi symptomami niewłaściwego RE są wymagania brakujące, niejasne lub nieprawidłowe. → Prawda.
  rules:
  - REG-KRY-T03-02
  see: N-T03-02
  truth: true
- id: '2'
  text: Założenie oczywistości wymagań jest wymienioną możliwą przyczyną.
  rationale: |-
    Syllabus wskazuje to założenie jako źródło niedostatków → Syllabus wskazuje pośpiech do budowania, problemy komunikacji, założenie oczywistości wymagań oraz niewystarczającą edukację i umiejętności RE jako przyczyny jego niedostatków. → Prawda.
  rules:
  - REG-T03-02-02
  see: N-T03-02
  truth: true
- id: '3'
  text: Sam niejasny zapis dowodzi, że autor nie odbył szkolenia RE.
  rationale: |-
    Brak edukacji jest jedną możliwością, nie jedyną przyczyną niejasności → Wymienienie kilku możliwych przyczyn niedostatków RE nie pozwala ustalić jednej pewnej przyczyny z samego objawu niejasnego wymagania. → Fałsz.
  rules:
  - REG-T03-02-03
  see: N-T03-02
  truth: false
- id: '4'
  text: Pośpieszne rozpoczęcie budowy i problemy komunikacji należą do wskazanych przyczyn.
  rationale: |-
    Oba mechanizmy występują w katalogu §1.2 → Syllabus wskazuje pośpiech do budowania, problemy komunikacji, założenie oczywistości wymagań oraz niewystarczającą edukację i umiejętności RE jako przyczyny jego niedostatków. → Prawda.
  rules:
  - REG-T03-02-02
  see: N-T03-02
  truth: true
