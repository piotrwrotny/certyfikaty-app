stem: |-
  Przed zbudowaniem obsługi zwrotów uzgodniono wyjątek zwrotu części zamówienia. Zespół poznaje potrzebne warianty i oczekiwany wynik. Oceń konsekwencje tego ustalenia.
options:
- id: '1'
  text: Można uwzględnić dodatkowe warianty w szacowaniu nakładu.
  rationale: Uzgodniono zakres wariantów → wymagania dostarczają podstawy estymacji → Prawda.
  rules:
  - REG-T03-01-02
  see: N-T03-01
  truth: true
- id: '2'
  text: Można przygotować testy z oczekiwanym wynikiem zwrotu częściowego.
  rationale: Opisano oczekiwany rezultat → wymagania są podstawą testowania → Prawda.
  rules:
  - REG-T03-01-03
  see: N-T03-01
  truth: true
- id: '3'
  text: Ustalenie uniemożliwia popełnienie błędu podczas implementacji.
  rationale: Treść określa oczekiwania, nie wykonanie kodu → podstawa testu nie jest gwarancją bezbłędności → Fałsz.
  rules:
  - REG-T03-01-03
  see: N-T03-01
  truth: false
- id: '4'
  text: Ustalenie może ograniczać ryzyko błędnego zachowania wobec potrzeby częściowego zwrotu.
  rationale: |-
    Wyjątek został rozpoznany przed realizacją → adekwatne RE może zmniejszać ryzyko niewłaściwego systemu → Prawda.
  rules:
  - REG-KRY-T03-01
  see: N-T03-01
  truth: true
