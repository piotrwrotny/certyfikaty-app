stem: |-
  Uzgodniono, kiedy rezerwacja może być anulowana i jakie dane muszą zostać odzyskane. Które DWIE korzyści wynikają bezpośrednio z takiego ustalenia?
options:
- id: a
  text: Każda przyszła zmiana staje się zbędna.
  rationale: |-
    Ewolucja potrzeb pozostaje możliwa → Właściwe RE może ograniczać ryzyko niewłaściwego systemu, poprawiać rozumienie problemu oraz dostarczać podstaw szacowania nakładu i kosztu oraz testowania. → nie wybrać.
  rules:
  - REG-KRY-T03-01
  see: N-T03-01
  correct: false
- id: b
  text: Można przygotować oczekiwane wyniki testów anulowania.
  rationale: Reguła opisuje oczekiwane zachowanie → podstawa testowania → wybrać.
  rules:
  - REG-T03-01-03
  see: N-T03-01
  correct: true
- id: c
  text: Można uwzględnić warianty anulowania w oszacowaniu nakładu.
  rationale: |-
    Zakres zachowania daje dane do estymacji → Wymagania dostarczają podstawy estymacji pracy i kosztu, a nie gwarancji trafności każdego oszacowania. → wybrać.
  rules:
  - REG-T03-01-02
  see: N-T03-01
  correct: true
- id: d
  text: Na pewno nie wystąpią defekty w implementacji.
  rationale: |-
    Uzgodnienie wymagań nie usuwa wszystkich usterek kodu → Wymagania określające oczekiwany system są podstawą testowania, a nie gwarancją braku defektów implementacji. → nie wybrać.
  rules:
  - REG-T03-01-03
  see: N-T03-01
  correct: false
